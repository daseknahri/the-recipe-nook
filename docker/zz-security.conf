# Server hygiene + security headers for the site (enabled next to le-cache.conf).
# Named zz- on purpose: conf-enabled loads alphabetically and the base image's own
# security.conf (ServerTokens OS) must not override the directives below.
# Header directives in server context apply to PHP responses too, not just static files.

# Do not advertise the Apache version/build.
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
  # Stop MIME sniffing, clickjacking of the site itself, and leaky referrers. Deliberately NOT
  # set: Cross-Origin-Opener/Resource-Policy and Content-Security-Policy — the ad/analytics
  # stack (AdSense, Funding Choices, gtag) is incompatible with a strict CSP, and a wrong one
  # would silently break revenue scripts; CSP stays a report-only item.
  Header set X-Content-Type-Options "nosniff"
  Header set X-Frame-Options "SAMEORIGIN"
  Header set Referrer-Policy "strict-origin-when-cross-origin"
  Header set Permissions-Policy "camera=(), microphone=(), geolocation=()"
  # HSTS: this host is only ever served over HTTPS in production (Traefik terminates TLS and
  # passes the header through). Host-scoped on purpose: no includeSubDomains, no preload.
  Header set Strict-Transport-Security "max-age=31536000"
</IfModule>

# XML-RPC is unused (no Jetpack, no remote app publishing; the DC Hardening mu-plugin also
# disables it inside WordPress). Deny the file outright.
<Files "xmlrpc.php">
  Require all denied
</Files>
